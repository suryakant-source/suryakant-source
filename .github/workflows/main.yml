name: Refresh public profile dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: '23 18 * * *'
concurrency:
  group: public-profile-dashboard
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install renderer dependencies
        run: python3 -m pip install Pillow==11.3.0 beautifulsoup4==4.13.4
      - name: Render changed public data only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 5-render_dashboard.py
      - name: Commit changed assets only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets-v3 README.md 4-public-dashboard-data.json
          if git diff --cached --quiet; then
            echo 'Public data unchanged; no commit.'
          else
            git commit -m 'Refresh dashboard from public GitHub data'
            git pull --no-rebase origin main
            git push
          fi
