name: Refresh contribution snake
on:
  workflow_dispatch:
  schedule:
    - cron: '23 18 * * *'
permissions:
  contents: write
jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Generate snake from public GitHub contributions
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            github-snake.svg
            github-snake-dark.svg?palette=github-dark
      - name: Commit changed animation only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add github-snake.svg github-snake-dark.svg
          if git diff --cached --quiet; then
            echo 'Animation unchanged; no commit.'
          else
            git commit -m 'Refresh contribution snake from public GitHub activity'
            git push
          fi
